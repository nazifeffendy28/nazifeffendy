        /* ============================================================
           FIRESTORE REST API
           ============================================================ */
        function toFS(v) {
            if (v === null || v === undefined) return { nullValue: null };
            if (typeof v === "boolean") return { booleanValue: v };
            if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
            if (typeof v === "string") return { stringValue: v };
            if (Array.isArray(v)) return { arrayValue: { values: v.map(toFS) } };
            if (typeof v === "object") {
                const fields = {};
                for (const [k, val] of Object.entries(v)) fields[k] = toFS(val);
                return { mapValue: { fields } };
            }
            return { stringValue: String(v) };
        }

        function fromFS(f) {
            if (!f) return null;
            if ("nullValue" in f) return null;
            if ("booleanValue" in f) return f.booleanValue;
            if ("integerValue" in f) return parseInt(f.integerValue);
            if ("doubleValue" in f) return f.doubleValue;
            if ("stringValue" in f) return f.stringValue;
            if ("arrayValue" in f) return (f.arrayValue.values || []).map(fromFS);
            if ("mapValue" in f) {
                const obj = {};
                for (const [k, v] of Object.entries(f.mapValue.fields || {})) obj[k] = fromFS(v);
                return obj;
            }
            return null;
        }

        async function fsGet(docId) {
            const r = await fetch(`${FS_BASE}/portfolio/${docId}`);
            if (!r.ok) {
                if (r.status === 404) return null;
                throw new Error(`Firestore GET ${docId}: ${r.status}`);
            }
            const doc = await r.json();
            if (!doc.fields) return null;
            const obj = {};
            for (const [k, v] of Object.entries(doc.fields)) obj[k] = fromFS(v);
            return obj;
        }

        async function fsSet(docId, data) {
            const fields = {};
            for (const [k, v] of Object.entries(data)) fields[k] = toFS(v);
            const r = await fetch(`${FS_BASE}/portfolio/${docId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fields })
            });
            if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || r.status); }
            return r.json();
        }

        /* ============================================================

           ============================================================ */
        function resizeImage(file, maxW = 1600) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxW / img.width);
                        const w = Math.round(img.width * scale);
                        const h = Math.round(img.height * scale);
                        const canvas = document.createElement("canvas");
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Resize failed")), "image/jpeg", 0.85);
                    };
                    img.onerror = () => reject(new Error("Image load failed"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("File read failed"));
                reader.readAsDataURL(file);
            });
        }

        async function uploadImage(file, sectionPath, onProgress) {
            if (!file) throw new Error("No file");
            if (file.size > 5 * 1024 * 1024) throw new Error("File >5MB");
            if (!/^image\//.test(file.type)) throw new Error("Not an image");
            const resized = await resizeImage(file, 1600);
            if (onProgress) onProgress(30);
            const base64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result.split(",")[1]);
                reader.onerror = () => reject(new Error("Read failed"));
                reader.readAsDataURL(resized);
            });
            if (onProgress) onProgress(60);
            const form = new FormData();
            form.append("key", IMGBB_KEY);
            form.append("image", base64);
            const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: form });
            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || res.status); }
            const json = await res.json();
            if (onProgress) onProgress(100);
            return json.data.url;
        }

        /* ============================================================
           HTML SANITIZER — simple whitelist for WYSIWYG output
           ============================================================ */
        const ALLOWED_TAGS = new Set(["B", "I", "U", "STRONG", "EM", "A", "UL", "OL", "LI", "H3", "P", "BR", "SPAN", "DIV"]);
        const ALLOWED_ATTRS = new Set(["href", "target", "rel"]);
        function sanitizeHtml(html) {
            const tpl = document.createElement("template");
            tpl.innerHTML = html || "";
            const walker = document.createTreeWalker(tpl.content, NodeFilter.SHOW_ELEMENT, null);
            const toRemove = [];
            const node = walker.currentNode;
            function visit(el) {
                if (!ALLOWED_TAGS.has(el.tagName)) { toRemove.push(el); return; }
                [...el.attributes].forEach(a => {
                    if (!ALLOWED_ATTRS.has(a.name.toLowerCase())) el.removeAttribute(a.name);
                    else if (a.name.toLowerCase() === "href" && /^javascript:/i.test(a.value)) el.removeAttribute(a.name);
                });
                if (el.tagName === "A") { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noreferrer"); }
                [...el.children].forEach(visit);
            }
            [...tpl.content.children].forEach(visit);
            toRemove.forEach(el => { while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el); el.remove(); });
            return tpl.innerHTML;
        }

        function useIsMobile(bp = 768) {
            const [m, setM] = useState(() => typeof window !== "undefined" && window.matchMedia(`(max-width: ${bp}px)`).matches);
            useEffect(() => {
                const mq = window.matchMedia(`(max-width: ${bp}px)`);
                const h = () => setM(mq.matches);
                mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
                return () => mq.removeEventListener ? mq.removeEventListener("change", h) : mq.removeListener(h);
            }, [bp]);
            return m;
        }

        /* ============================================================
           AUDIO CONTEXT (with volume 0-100)
           ============================================================ */
        const AudioCtx = createContext(null);
        function AudioProvider({ children }) {
            const ref = useRef(null);
            const [playing, setPlaying] = useState(false);
            const [hasEntered, setHasEntered] = useState(false);
            const [volume, setVolumeState] = useState(() => {
                const v = parseInt(localStorage.getItem("portfolio-audio-volume"));
                return Number.isFinite(v) && v >= 0 && v <= 100 ? v : 70;
            });

            useEffect(() => {
                if (ref.current) ref.current.volume = volume / 100;
                localStorage.setItem("portfolio-audio-volume", String(volume));
            }, [volume]);

            const setVolume = useCallback(v => {
                const clamped = Math.max(0, Math.min(100, Math.round(v)));
                setVolumeState(clamped);
            }, []);

            const enter = useCallback(() => {
                setHasEntered(true);
                const a = ref.current;
                if (!a) return;
                a.volume = volume / 100;
                const p = a.play();
                if (p && typeof p.then === "function") {
                    p.then(() => setPlaying(true)).catch(() => setPlaying(false));
                }
            }, [volume]);

            const toggle = useCallback(() => {
                const a = ref.current;
                if (!a) return;
                if (a.paused) {
                    a.volume = volume / 100;
                    const p = a.play();
                    if (p && typeof p.then === "function") {
                        p.then(() => setPlaying(true)).catch(() => setPlaying(false));
                    } else { setPlaying(true); }
                } else {
                    a.pause();
                    setPlaying(false);
                }
            }, [volume]);

            useEffect(() => {
                const a = ref.current; if (!a) return;
                const onPlay = () => setPlaying(true);
                const onPause = () => setPlaying(false);
                a.addEventListener("play", onPlay);
                a.addEventListener("pause", onPause);
                return () => { a.removeEventListener("play", onPlay); a.removeEventListener("pause", onPause); };
            }, []);

            return (
                <AudioCtx.Provider value={{ playing, hasEntered, enter, toggle, volume, setVolume }}>
                    <audio ref={ref} src={AUDIO_SRC} loop preload="auto" />
                    {children}
                </AudioCtx.Provider>
            );
        }
        function useAudio() { return useContext(AudioCtx); }

        /* ============================================================
           PANEL CONTEXT
           ============================================================ */
        const PanelCtx = createContext(null);
        function PanelProvider({ children }) {
            const total = PANELS.length;
            const [panel, setPanelRaw] = useState(() => {
                if (typeof location === "undefined") return 0;
                const id = location.hash.slice(1);
                const idx = PANELS.findIndex(p => p.id === id);
                return idx >= 0 ? idx : 0;
            });
            const setPanel = useCallback((p) => {
                setPanelRaw((prev) => {
                    const v = typeof p === "function" ? p(prev) : p;
                    const clamped = Math.max(0, Math.min(total - 1, v));
                    const id = PANELS[clamped]?.id;
                    if (id && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
                    return clamped;
                });
            }, [total]);
            const goTo = useCallback((id) => {
                const idx = PANELS.findIndex((p) => p.id === id);
                if (idx >= 0) setPanel(idx);
            }, [setPanel]);
            useEffect(() => {
                const onHash = () => {
                    const id = location.hash.slice(1);
                    const idx = PANELS.findIndex(p => p.id === id);
                    if (idx >= 0) setPanelRaw(idx);
                };
                window.addEventListener("hashchange", onHash);
                return () => window.removeEventListener("hashchange", onHash);
            }, []);
            return (
                <PanelCtx.Provider value={{ panel, setPanel, goTo, total }}>{children}</PanelCtx.Provider>
            );
        }
        function usePanel() { return useContext(PanelCtx); }

            return (

        /* ============================================================
           DRAG-SORT HOOK
           ============================================================ */
        function useDragSort(items, onSave) {
            const [dragIdx, setDragIdx] = useState(null);
            const [overIdx, setOverIdx] = useState(null);
            return (idx) => ({
                draggable: true,
                onDragStart: (e) => { e.dataTransfer.effectAllowed = "move"; setDragIdx(idx); },
                onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (idx !== dragIdx) setOverIdx(idx); },
                onDrop: (e) => {
                    e.preventDefault();
                    if (dragIdx !== null && dragIdx !== idx) {
                        const arr = [...items];
                        const [spliced] = arr.splice(dragIdx, 1);
                        arr.splice(idx, 0, spliced);
                        onSave(arr);
                    }
                    setDragIdx(null); setOverIdx(null);
                },
                onDragEnd: () => { setDragIdx(null); setOverIdx(null); },
                style: {
                    opacity: dragIdx === idx ? 0.3 : 1,
                    outline: overIdx === idx && dragIdx !== idx ? "2px solid rgba(107,163,122,.65)" : "2px solid transparent",
                    outlineOffset: 2, borderRadius: 12, transition: "opacity .1s", cursor: "grab"
                }
            });
        }

        /* ============================================================
           DYNAMIC STYLE VARS — inject CSS variables per section
           ============================================================ */
        function DynamicStyleVars({ styles }) {
            const css = useMemo(() => {
                const p = styles.photo || DEFAULT_STYLES_DOC.photo;
                const rootRules = `:root{--photo-brightness:${p.brightness};--photo-saturate:${p.saturate};--photo-contrast:${p.contrast};--photo-sepia:${p.sepia};--photo-overlay-alpha:${p.overlay};}`;
                const sectionRules = STYLE_SECTIONS.map(id => {
                    const s = (styles.sections || {})[id] || DEFAULT_SECTION_STYLE;
                    return `[data-section="${id}"]{--card-bg-alpha:${s.cardBgAlpha};--card-border-alpha:${s.cardBorderAlpha};--photo-brightness-local:${s.imageBrightness};--photo-overlay-local:${s.imageOverlay};}`;
                }).join("");
                return rootRules + sectionRules;
            }, [styles]);
            return <style dangerouslySetInnerHTML={{ __html: css }} />;
        }

        /* ============================================================
           IMAGE UPLOADER COMPONENT
           ============================================================ */
        function ImageUploader({ value, onChange, sectionPath = "misc" }) {
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [dragover, setDragover] = useState(false);
            const [err, setErr] = useState("");

            const handleFile = async file => {
                setErr(""); setUploading(true); setProgress(5);
                try {
                    const url = await uploadImage(file, sectionPath, setProgress);
                    onChange(url);
                } catch (e) { setErr(e.message); }
                finally { setUploading(false); setProgress(0); }
            };

            return (
                <div className="image-uploader">
                    {value ? (
                        <div className="image-uploader-preview">
                            <img src={value} alt="preview" />
                            <div className="image-uploader-actions" style={{ padding: 6 }}>
                                <label style={adminBtn("")}>
                                    ↻ Replace
                                    <input type="file" accept="image/*" style={{ display: "none" }}
                                        onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
                                </label>
                                <button onClick={() => onChange("")} style={adminBtn("red")}>✕ Remove</button>
                            </div>
                        </div>
                    ) : (
                        <div className={"image-uploader-dropzone" + (dragover ? " dragover" : "")}
                            onDragOver={e => { e.preventDefault(); setDragover(true); }}
                            onDragLeave={() => setDragover(false)}
                            onDrop={e => {
                                e.preventDefault(); setDragover(false);
                                const f = e.dataTransfer.files[0];
                                if (f) handleFile(f);
                            }}>
                            {uploading ? <span className="image-uploader-progress">UPLOADING… {progress}%</span>
                                : <>Drag &amp; drop image or click to browse <br /><span style={{ fontSize: 10, opacity: .6 }}>JPG/PNG/WebP, max 5MB · resized to 1600px</span></>}
                            <input type="file" accept="image/*"
                                onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
                        </div>
                    )}
                    {err && <div style={{ color: "#ff8888", fontSize: 11 }}>{err}</div>}
                </div>
            );
        }

        /* ============================================================
           RICH TEXT EDITOR — contentEditable WYSIWYG
           ============================================================ */
        function RichEditor({ value, onChange, rows = 4 }) {
            const ref = useRef(null);
            const skipSync = useRef(false);

            useEffect(() => {
                if (!ref.current) return;
                if (skipSync.current) { skipSync.current = false; return; }
                if (ref.current.innerHTML !== (value || "")) {
                    ref.current.innerHTML = value || "";
                }
            }, [value]);

            const exec = cmd => { document.execCommand(cmd, false, null); ref.current?.focus(); syncOut(); };
            const execLink = () => {
                const url = window.prompt("Enter URL:", "https://");
                if (url) { document.execCommand("createLink", false, url); syncOut(); }
            };
            const execClear = () => { document.execCommand("removeFormat"); syncOut(); };

            const syncOut = () => {
                if (!ref.current) return;
                skipSync.current = true;
                const clean = sanitizeHtml(ref.current.innerHTML);
                onChange(clean);
            };

            const handleKey = e => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") { e.preventDefault(); exec("bold"); }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "i") { e.preventDefault(); exec("italic"); }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "u") { e.preventDefault(); exec("underline"); }
            };

            return (
                <div className="rich-editor">
                    <div className="rich-editor-toolbar">
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => exec("bold")} title="Bold (Ctrl+B)"><b>B</b></button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => exec("italic")} title="Italic (Ctrl+I)"><i>I</i></button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => exec("underline")} title="Underline (Ctrl+U)"><u>U</u></button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => exec("strikeThrough")} title="Strike"><s>S</s></button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={execLink} title="Link">🔗</button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => exec("insertUnorderedList")} title="Bullet list">• ⋮</button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => exec("insertOrderedList")} title="Numbered list">1.</button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => { document.execCommand("formatBlock", false, "h3"); syncOut(); }} title="Heading">H</button>
                        <button type="button" onMouseDown={e => e.preventDefault()} onClick={execClear} title="Clear formatting">⌫</button>
                    </div>
                    <div ref={ref} className="rich-editor-content" contentEditable suppressContentEditableWarning
                        style={{ minHeight: rows * 22 }}
                        onInput={syncOut} onBlur={syncOut} onKeyDown={handleKey} />
                </div>
            );
        }

        /* ============================================================
           GLOBAL DOT GRID
           ============================================================ */
        function GlobalDotGrid() {
            const canvasRef = useRef(null);
            const sRef = useRef({ mouse: { x: -9999, y: -9999, active: false }, dots: [], raf: 0 });
            useEffect(() => {
                const canvas = canvasRef.current; if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const spacing = 22;
                const s = sRef.current;
                function resize() {
                    const vw = window.innerWidth, vh = window.innerHeight;
                    canvas.width = vw * dpr; canvas.height = vh * dpr;
                    canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    buildDots();
                }
                function buildDots() {
                    const vw = window.innerWidth, vh = window.innerHeight;
                    const cols = Math.ceil(vw / spacing) + 1;
                    const rows = Math.ceil(vh / spacing) + 2;
                    const offX = ((vw % spacing) / 2) + spacing / 2;
                    const arr = [];
                    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
                        const bx = offX + j * spacing, by = i * spacing + spacing / 2;
                        arr.push({ bx, by, x: bx, y: by, vx: 0, vy: 0, a: 1 });
                    }
                    s.dots = arr;
                }
                function tick() {
                    const vw = parseInt(canvas.style.width) || window.innerWidth;
                    const vh = parseInt(canvas.style.height) || window.innerHeight;
                    const m = s.mouse, infl = 100;
                    ctx.clearRect(0, 0, vw, vh);
                    const dots = s.dots;
                    for (let k = 0; k < dots.length; k++) {
                        const d = dots[k];
                        d.vx += (d.bx - d.x) * 0.14;
                        d.vy += (d.by - d.y) * 0.14;
                        if (m.active) {
                            const dx = d.x - m.x, dy = d.y - m.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < infl) {
                                const force = 1 - dist / infl;
                                const ff = force * force * 0.52;
                                d.vx += (dx / (dist || 1)) * ff * 16;
                                d.vy += (dy / (dist || 1)) * ff * 16;
                                d.a += (Math.max(0.2, dist / infl) - d.a) * 0.22;
                            } else d.a += (1 - d.a) * 0.08;
                        } else d.a += (1 - d.a) * 0.06;
                        d.vx *= 0.74; d.vy *= 0.74;
                        d.x += d.vx; d.y += d.vy;
                        if (d.a < 0.015) continue;
                        ctx.globalAlpha = d.a * 0.32;
                        ctx.fillStyle = "rgb(168,114,69)";
                        ctx.beginPath(); ctx.arc(d.x, d.y, 1.5, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    s.raf = requestAnimationFrame(tick);
                }
                resize();
                s.raf = requestAnimationFrame(tick);
                const onMove = e => { s.mouse.x = e.clientX; s.mouse.y = e.clientY; s.mouse.active = true; };
                const onLeave = () => { s.mouse.active = false; };
                window.addEventListener("resize", resize);
                window.addEventListener("mousemove", onMove);
                document.addEventListener("mouseleave", onLeave);
                return () => {
                    cancelAnimationFrame(s.raf);
                    window.removeEventListener("resize", resize);
                    window.removeEventListener("mousemove", onMove);
                    document.removeEventListener("mouseleave", onLeave);
                };
            }, []);
            return <canvas ref={canvasRef} style={{ position: "fixed", top: 0, left: 0, pointerEvents: "none", zIndex: 1 }} />;
        }

        /* ============================================================
           TILT HOOK — 3D mouse-tracking effect for image cards
           ============================================================ */
        function useTilt(intensity = 10) {
            const [tilt, setTilt] = useState({ rx: 0, ry: 0, x: 50, y: 50 });
            const [isHovered, setIsHovered] = useState(false);
            const onMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const xVal = e.clientX - rect.left, yVal = e.clientY - rect.top;
                const ry = ((xVal - rect.width / 2) / (rect.width / 2)) * intensity;
                const rx = -((yVal - rect.height / 2) / (rect.height / 2)) * intensity;
                setTilt({ rx, ry, x: (xVal / rect.width) * 100, y: (yVal / rect.height) * 100 });
            };
            const onMouseEnter = () => setIsHovered(true);
            const onMouseLeave = () => { setIsHovered(false); setTilt({ rx: 0, ry: 0, x: 50, y: 50 }); };
            return {
                isHovered,
                handlers: { onMouseMove, onMouseEnter, onMouseLeave },
                tiltStyle: {
                    transform: isHovered
                        ? `perspective(900px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg) scale(1.03)`
                        : `perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)`,
                    transition: isHovered ? "transform 0.12s ease-out" : "transform 0.55s var(--ease-soft)",
                    zIndex: isHovered ? 5 : "auto"
                },
                spotlight: `radial-gradient(circle at ${tilt.x}% ${tilt.y}%, rgba(255,220,180,${isHovered ? ".1" : "0"}) 0%, transparent 55%)`
            };
        }

            const borderGlow =
                glow === "moss"

            const responsivePadding = typeof padding === "number" ? `clamp(18px, 4vw, ${padding}px)` : padding;
            const handleMouseMove = (e) => {
                if (glowRef.current) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    glowRef.current.style.background = `radial-gradient(circle at ${x}% ${y}%, ${glowColor} 0%, transparent 58%)`;
                }
                if (onMouseMove) onMouseMove(e);
            };
            const handleMouseEnter = (e) => {
                if (glowRef.current) glowRef.current.style.opacity = "1";
                if (onMouseEnter) onMouseEnter(e);
            };
            const handleMouseLeave = (e) => {
                if (glowRef.current) glowRef.current.style.opacity = "0";

            return (
                <div className={"bento-card " + className} data-area={area}

        function ExperienceSection() {
            const { experience: experiences } = useAdmin();
            const [activeId, setActiveId] = useState(null);
            const cardRefs = useRef({});

            useEffect(() => {
                if (!experiences.length) return;
                setActiveId(prev => prev || (experiences[0]?.id || experiences[0]?.role));
                const obs = [];
                experiences.forEach(exp => {
                    const key = exp.id || exp.role;
                    const el = cardRefs.current[key];
                    if (!el) return;
                    const ob = new IntersectionObserver(
                        ([entry]) => { if (entry.isIntersecting) setActiveId(key); },
                        { threshold: 0.2 }
                    );
                    ob.observe(el);
                    obs.push(ob);
                });
                return () => obs.forEach(ob => ob.disconnect());
            }, [experiences]);

            const scrollToCard = (key) => {
                const el = cardRefs.current[key];
                if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
            };

            return (
                <div data-section="experience" style={{ display: "flex", flexDirection: "column", gap: 24 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                        <MetaLabel glow="sepia">02 · Experience</MetaLabel>
                        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, color: "#a87245" }}>Nazif Hamza Effendy</span>
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "1.2fr 2fr", gap: "0 32px", alignItems: "start", marginTop: 12 }} className="grid-experience">

                        {/* Left: sticky heading + TOC nav below */}

                            </h2>
                            <p style={{ color: "var(--cream-dim)", fontSize: 14.5, lineHeight: 1.65, margin: "0 0 28px" }}>
                                A comprehensive record of student leadership, independent music production, and professional technology industry experience.

                            {/* TOC nav */}
                            <div className="exp-toc-nav">

                                    Index
                                </div>
                                {experiences.map((exp) => {
                                    const key = exp.id || exp.role;
                                    return (
                                        <button key={key} onClick={() => scrollToCard(key)}
                                            className={"exp-toc-item" + (activeId === key ? " active" : "")}>
                                            <span className="exp-toc-role">{exp.role}</span>
                                            <span className="exp-toc-time">{exp.time}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Right: cards */}
                        <div className="zoom-group" style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                            {experiences.map((exp, i) => (
                                <div key={exp.id || i} ref={el => { cardRefs.current[exp.id || exp.role] = el; }}>
                                    <ExperienceCardItem exp={exp} />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

                                    filter: "saturate(var(--photo-saturate)) contrast(var(--photo-contrast)) brightness(var(--photo-brightness)) sepia(var(--photo-sepia))",

                                <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", color: "#7e6753", fontFamily: "'JetBrains Mono',monospace", fontSize: 11 }}>

                            )}

                            <div style={{ position: "absolute", bottom: 22, left: 22, right: 22 }}>
                                <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: 36, lineHeight: 1, color: "#f4e6d1", letterSpacing: "-.01em" }}>

                        <Card glow="mixed" padding={28}>

                                        display: "grid", gridTemplateColumns: "36px 1fr auto", gap: 12, alignItems: "center",
                                        padding: "9px 12px", borderRadius: 12, background: "rgba(168,114,69,.06)",
                                        border: "1px solid rgba(168,114,69,.18)", color: "var(--cream)", textDecoration: "none", transition: "all .35s ease"

                                        <span style={{ width: 26, height: 26, borderRadius: 8, display: "grid", placeItems: "center", background: "rgba(56,142,60,.1)", border: "1px solid rgba(107,163,122,.3)", fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "#9bd1a8" }}>{l.glyph}</span>
                                        <div>
                                            <div style={{ fontSize: 12, fontWeight: 500 }}>{l.label}</div>
                                            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "var(--cream-dim)", letterSpacing: ".05em" }}>{l.handle}</div>
                                        </div>
                                        <span className="contact-arrow" style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: "#a87245" }}>↗</span>
                                    </a>
                                ))}
                            </div>
                        </Card>

                        <Card glow="moss" padding={28}>
                            <MetaLabel glow="moss">Location</MetaLabel>
                            <h4 style={{ margin: "14px 0 8px", fontFamily: "'Instrument Serif',serif", fontSize: 24, color: "var(--cream)" }}>Jakarta / Tangsel</h4>
                            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
                                {[
                                    { label: "Based in", val: "Jakarta / Tangsel, Indonesia" },
                                    { label: "Timezone", val: "WIB · UTC+7", font: true },
                                    { label: "University", val: "Universitas Budi Luhur" },

                            <p style={{ fontSize: 12.5, color: "var(--cream-dim)", margin: "0 0 16px" }}>Drop a message — I'll respond within 24 hours.</p>
                            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                                {[
                                    { lbl: "Name", typ: "text", ph: "Your name", k: "name" },
                                    { lbl: "Email", typ: "email", ph: "Your email address", k: "email" },

                                    <div key={lbl}>
                                        <label style={{ display: "block", fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "#a87245", textTransform: "uppercase", marginBottom: 4, letterSpacing: ".15em" }}>{lbl}</label>
                                        <input type={typ} placeholder={ph} value={form[k]} onChange={upd(k)} style={{ width: "100%", padding: "9px 12px", borderRadius: 8, background: "rgba(12,8,5,.8)", border: "1px solid rgba(168,114,69,.2)", color: "var(--cream)", outline: "none", fontSize: 13, boxSizing: "border-box" }} />
                                    </div>
                                ))}
                                <div>
                                    <label style={{ display: "block", fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "#a87245", textTransform: "uppercase", marginBottom: 4, letterSpacing: ".15em" }}>Message</label>
                                    <textarea rows="3" placeholder="Hi Nazif, let's collaborate on…" value={form.message} onChange={upd("message")}
                                        style={{ width: "100%", padding: "9px 12px", borderRadius: 8, background: "rgba(12,8,5,.8)", border: "1px solid rgba(168,114,69,.2)", color: "var(--cream)", outline: "none", resize: "none", fontSize: 13, boxSizing: "border-box" }} />
                                </div>
                                <button onClick={handleSubmit} style={{
                                    width: "100%", padding: "11px", borderRadius: 8,
                                    background: sent ? "linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%)" : "linear-gradient(135deg, #5D4037 0%, #388E3C 100%)",
                                    color: "#fff8ed", fontSize: 13, fontWeight: 600,
                                    border: "1px solid rgba(200,144,103,.4)",
                                    boxShadow: "0 6px 18px -6px rgba(56,142,60,.55)",
                                    cursor: "pointer", transition: "background .4s ease"

                                    {sent ? "✓ Opening mail client…" : "Send Message ✉"}

                        </Card>

                        <Card glow="moss" padding={28}>
                            <MetaLabel glow="moss">Availability</MetaLabel>
                            <h4 style={{ margin: "14px 0 8px", fontFamily: "'Instrument Serif',serif", fontSize: 22, color: "var(--cream)" }}>Open to roles &amp; collaboration.</h4>
                            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                                <Pill accent="moss">● Available</Pill>
                                <Pill accent="sepia">Remote</Pill>
                                <Pill accent="sepia">Hybrid</Pill>
                            </div>
                            <div style={{ display: "flex", flexDirection: "column", gap: 8, fontSize: 13, color: "var(--cream-dim)", lineHeight: 1.5 }}>
                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>CS &amp; AI/NLP research collaboration or internship</span></div>
                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>Full-stack web development projects</span></div>
                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>Music production collaboration or creative partnership</span></div>
                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>Software engineering roles with a creative angle</span></div>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        }

        /* ============================================================
           WELCOME OVERLAY
           ============================================================ */
        function WelcomeOverlay() {
            const { hasEntered, enter } = useAudio();
            const [exiting, setExiting] = useState(false);
            const [hidden, setHidden] = useState(() => hasEntered);
            const handleEnter = () => {
                enter();
                setExiting(true);
                setTimeout(() => setHidden(true), 950);
            };
            useEffect(() => {
                const onKey = (e) => {
                    if (!hidden && (e.key === "Enter" || e.key === " ")) {
                        e.preventDefault(); handleEnter();
                    }
                };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, [hidden]);
            if (hidden) return null;
            return (
                <div className={"welcome-overlay" + (exiting ? " exit" : "")} data-no-wheel>
                    <div className="welcome-content">
                        <div className="welcome-meta">Portfolio · 2026</div>
                        <h1 className="welcome-title">
                            Nazif <em>Hamza</em><br />Effendy
                        </h1>
                        <div className="welcome-sub">CS Student · Music Producer · Jakarta</div>
                        <div className="welcome-divider" />
                        <button className="welcome-enter" onClick={handleEnter} autoFocus>
                            Enter the experience <span>→</span>
                        </button>
                        <div className="welcome-audio-hint">
                            <i /> with original score by Fizan
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================================================
           AUDIO CONTROL (play/pause + volume slider)
           ============================================================ */
        function SpeakerIcon({ volume, muted }) {
            if (muted || volume === 0) {
                return (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5L6 9H2v6h4l5 4V5z" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>);
            }
            return (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5L6 9H2v6h4l5 4V5z" />{volume >= 34 && <path d="M15.5 8.5a5 5 0 0 1 0 7" />}{volume >= 67 && <path d="M18.5 5.5a9 9 0 0 1 0 13" />}</svg>);
        }

        function AudioControl() {
            const { playing, toggle, hasEntered, volume, setVolume } = useAudio();
            if (!hasEntered) return null;
            const muted = !playing;
            return (
                <div className="audio-control">
                    <div className="audio-volume-wrap">
                        <button
                            className={"audio-toggle" + (muted ? " muted" : "")}
                            onClick={toggle}
                            aria-label={playing ? "Pause music" : "Play music"}
                            title={playing ? "Pause music" : "Play music"}
                            style={{ width: 32, height: 32, border: "none", background: "transparent" }}
                        >
                            <SpeakerIcon volume={volume} muted={muted} />
                        </button>
                        <input
                            type="range" min="0" max="100" value={volume}
                            onChange={e => setVolume(parseInt(e.target.value))}
                            className="audio-volume-slider"
                            aria-label="Volume"
                            title={`Volume: ${volume}%`}
                        />
                    </div>
                </div>
            );
        }

        /* ============================================================
           NAV BAR (top) + MOBILE MENU (hamburger)
           ============================================================ */
        function MobileMenu({ open, onClose }) {
            const { panel, setPanel } = usePanel();
            useEffect(() => {
                if (!open) return;
                const onKey = e => { if (e.key === "Escape") onClose(); };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, [open, onClose]);
            return (
                <>
                    <div className={"mobile-menu-backdrop" + (open ? " open" : "")} onClick={onClose} />
                    <aside className={"mobile-menu" + (open ? " open" : "")} aria-hidden={!open}>
                        <div className="mobile-menu-header">
                            <div className="mobile-menu-title">Navigate</div>
                            <button className="mobile-menu-close" onClick={onClose} aria-label="Close">×</button>
                        </div>
                        <div className="mobile-menu-list">
                            {PANELS.map((p, i) => (
                                <button key={p.id}
                                    className={"mobile-menu-item" + (i === panel ? " active" : "")}
                                    onClick={() => { setPanel(i); onClose(); }}>
                                    <span>{p.label}</span>
                                    <span className="mobile-menu-item-num">{String(i + 1).padStart(2, "0")}</span>
                                </button>
                            ))}
                        </div>
                        <div className="mobile-menu-footer">© 2026 NAZIF</div>
                    </aside>
                </>
            );
        }

        function NavBar() {
            const { panel, goTo } = usePanel();
            const navItems = useMemo(() => PANELS.filter(p => p.inNav), []);
            const currentId = PANELS[panel]?.id;
            const isMobile = useIsMobile();
            const [menuOpen, setMenuOpen] = useState(false);
            useEffect(() => { if (!isMobile) setMenuOpen(false); }, [isMobile]);

            return (
                <>
                    <header className="nav-bar">
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                            <div className="nav-brand-mark">n</div>
                            <div className="nav-brand-text">
                                <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: 17, color: "var(--cream)", lineHeight: 1 }}>nazif.effendy</div>
                                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "#a87245", letterSpacing: ".22em" }}>CS · MUSIC · AI · JAKARTA</div>
                            </div>
                        </div>

                        <nav className="nav-pills">
                            {navItems.map(p => (
                                <button key={p.id}
                                    className={"nav-pill" + (currentId === p.id ? " active" : "")}
                                    onClick={() => goTo(p.id)}>
                                    {p.label}
                                </button>
                            ))}
                        </nav>

                        <div className="nav-right">
                            <span className="nav-status">● ONLINE</span>
                            <AudioControl />
                            <button className="nav-resume" onClick={() => goTo("contact")}>Contact Me</button>
                            <button className={"hamburger" + (menuOpen ? " open" : "")} onClick={() => setMenuOpen(v => !v)} aria-label="Menu" aria-expanded={menuOpen}>
                                <span className="hamburger-bars"><span /><span /><span /></span>
                            </button>
                        </div>
                    </header>
                    <MobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} />
                </>
            );
        }

        /* ============================================================
           HORIZONTAL TRACK
           ============================================================ */
        function HorizontalTrack({ children }) {
            const { panel, setPanel, total } = usePanel();
            const trackRef = useRef(null);
            useEffect(() => {
                const onKey = (e) => {
                    const tag = e.target?.tagName;
                    if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) return;
                    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); setPanel(p => p + 1); }
                    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); setPanel(p => p - 1); }
                    else if (e.key === "Home") { e.preventDefault(); setPanel(0); }
                    else if (e.key === "End") { e.preventDefault(); setPanel(total - 1); }
                };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, [setPanel, total]);
            return (
                <div className="track-viewport" ref={trackRef}>
                    <div className="track" style={{
                        width: `${total * 100}vw`,
                        transform: `translate3d(-${panel * 100}vw, 0, 0)`
                    }}>
                        {children}
                    </div>
                </div>
            );
        }

        function Panel({ id, children }) {
            const { panel } = usePanel();
            const idx = PANELS.findIndex(p => p.id === id);
            const isActive = idx === panel;
            return (
                <section className={"panel" + (isActive ? " is-active" : "")} id={id} data-panel={id}>
                    <div className="panel-content" key={isActive ? id + "-on" : id + "-off"}>
                        {children}
                    </div>
                </section>
            );
        }

        /* ============================================================
           LOADING / ERROR SCREENS
           ============================================================ */
        function LoadingScreen() {
            return (
                <div className="loading-screen">
                    <div className="loading-content">
                        <div className="loading-spinner" />
                        <div className="loading-text">Loading portfolio…</div>
                    </div>
                </div>
            );
        }
        function ErrorScreen({ message, onRetry }) {
            return (
                <div className="error-screen">
                    <div className="error-content">
                        <div style={{ fontSize: 36 }}>⚠</div>
                        <div className="error-text">Failed to load · {message}</div>
                        <button onClick={onRetry}>Retry</button>
                    </div>
                </div>
            );
        }

        /* ============================================================
           STAGE + APP
           ============================================================ */
        function Stage() {
            const { hasEntered } = useAudio();
            return (
                <div className={"stage" + (hasEntered ? " entered" : "")}>
                    <NavBar />
                    <HorizontalTrack>
                        <Panel id="home"><HomePanel /></Panel>
                        <Panel id="about"><AboutSection /></Panel>
                        <Panel id="experience"><ExperienceSection /></Panel>
                        <Panel id="skills"><SkillsSection /></Panel>
                        <Panel id="projects"><ProjectsSection /></Panel>
                        <Panel id="numbers"><NumbersSection /></Panel>
                        <Panel id="contact"><ContactSection /></Panel>
                    </HorizontalTrack>
                </div>
            );
        }

        function AppInner() {
            const { loading, loadError, reload, stylesData } = useAdmin();
            if (loading) return <LoadingScreen />;
            if (loadError) return <ErrorScreen message={loadError} onRetry={reload} />;
            return (
                <>
                    <DynamicStyleVars styles={stylesData} />
                    <GlobalDotGrid />
                    <WelcomeOverlay />
                    <Stage />
                </>
            );
        }

        function App() {
            return (
                <AudioProvider>
                    <AdminProvider>
                        <PanelProvider>
                            <AppInner />
                        </PanelProvider>
                    </AdminProvider>
                </AudioProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>

        const FS_BASE = "https://firestore.googleapis.com/v1/projects/nazifeffendy-97f18/databases/(default)/documents";

        function toFS(v) {
            if (v === null || v === undefined) return { nullValue: null };
            if (typeof v === "boolean") return { booleanValue: v };
            if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
            if (typeof v === "string") return { stringValue: v };
            if (Array.isArray(v)) return { arrayValue: { values: v.map(toFS) } };
            if (typeof v === "object") {
                const fields = {};
                for (const [k, val] of Object.entries(v)) fields[k] = toFS(val);
                return { mapValue: { fields } };
            }
            return { stringValue: String(v) };
        }

        function fromFS(f) {
            if (!f) return null;
            if ("nullValue" in f) return null;
            if ("booleanValue" in f) return f.booleanValue;
            if ("integerValue" in f) return parseInt(f.integerValue);
            if ("doubleValue" in f) return f.doubleValue;
            if ("stringValue" in f) return f.stringValue;
            if ("arrayValue" in f) return (f.arrayValue.values || []).map(fromFS);
            if ("mapValue" in f) {
                const obj = {};
                for (const [k, v] of Object.entries(f.mapValue.fields || {})) obj[k] = fromFS(v);
                return obj;
            }
            return null;
        }

        async function fsGet(docId) {
            const r = await fetch(`${FS_BASE}/portfolio/${docId}`);
            if (!r.ok) return null;
            const doc = await r.json();
            if (!doc.fields) return null;
            const obj = {};
            for (const [k, v] of Object.entries(doc.fields)) obj[k] = fromFS(v);
            return obj;
        }

        async function fsSet(docId, data) {
            const fields = {};
            for (const [k, v] of Object.entries(data)) fields[k] = toFS(v);
            const r = await fetch(`${FS_BASE}/portfolio/${docId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fields })
            });
            if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || r.status); }
            return r.json();
        }

        /* ============================================================
           AUDIO CONTEXT
           ============================================================ */
        const AudioCtx = createContext(null);
        function AudioProvider({ children }) {
            const ref = useRef(null);
            const [playing, setPlaying] = useState(false);
            const [hasEntered, setHasEntered] = useState(false);

            const enter = useCallback(() => {
                setHasEntered(true);
                const a = ref.current;
                if (!a) return;
                a.volume = 0.5;
                const p = a.play();
                if (p && typeof p.then === "function") {
                    p.then(() => setPlaying(true)).catch(() => setPlaying(false));
                }
            }, []);

            const toggle = useCallback(() => {
                const a = ref.current;
                if (!a) return;
                if (a.paused) {
                    a.volume = 0.5;
                    const p = a.play();
                    if (p && typeof p.then === "function") {
                        p.then(() => setPlaying(true)).catch(() => setPlaying(false));
                    } else { setPlaying(true); }
                } else {
                    a.pause();
                    setPlaying(false);
                }
            }, []);

            useEffect(() => {
                const a = ref.current;
                if (!a) return;
                const onPlay = () => setPlaying(true);
                const onPause = () => setPlaying(false);
                a.addEventListener("play", onPlay);
                a.addEventListener("pause", onPause);
                return () => {
                    a.removeEventListener("play", onPlay);
                    a.removeEventListener("pause", onPause);
                };
            }, []);

            return (
                <AudioCtx.Provider value={{ playing, hasEntered, enter, toggle }}>
                    <audio ref={ref} src={AUDIO_SRC} loop preload="auto" />
                    {children}
                </AudioCtx.Provider>
            );
        }
        function useAudio() { return useContext(AudioCtx); }

                if (typeof location === "undefined") return 0;
                const id = location.hash.slice(1);
                const idx = PANELS.findIndex(p => p.id === id);
                return idx >= 0 ? idx : 0;
            });

            const setPanel = useCallback((p) => {
                setPanelRaw((prev) => {
                    const v = typeof p === "function" ? p(prev) : p;
                    const clamped = Math.max(0, Math.min(total - 1, v));
                    const id = PANELS[clamped]?.id;
                    if (id && location.hash !== "#" + id) {
                        history.replaceState(null, "", "#" + id);
                    }
                    return clamped;
                });
            }, [total]);

            const goTo = useCallback((id) => {
                const idx = PANELS.findIndex((p) => p.id === id);
                if (idx >= 0) setPanel(idx);
            }, [setPanel]);

            useEffect(() => {
                const onHash = () => {
                    const id = location.hash.slice(1);
                    const idx = PANELS.findIndex(p => p.id === id);
                    if (idx >= 0) setPanelRaw(idx);
                };
                window.addEventListener("hashchange", onHash);
                return () => window.removeEventListener("hashchange", onHash);
            }, []);

            return (
                <PanelCtx.Provider value={{ panel, setPanel, goTo, total }}>
                    {children}
                </PanelCtx.Provider>
            );
        }
        function usePanel() { return useContext(PanelCtx); }

        /* ============================================================
           ADMIN CONTEXT
           ============================================================ */
        const AdminCtx = createContext(null);
        function AdminProvider({ children }) {
            const [isAdmin, setIsAdmin] = useState(false);
            const [showPanel, setShowPanel] = useState(false);

            const [skills, setSkills] = useState(DEFAULT_SKILL_GROUPS);
            const [projects, setProjects] = useState(DEFAULT_CREATIONS);
            const [experience, setExperience] = useState(DEFAULT_EXPERIENCE);
            const [contactLinks, setContactLinks] = useState(DEFAULT_CONTACT_LINKS);
            const [aboutData, setAboutData] = useState({ paragraphs: DEFAULT_ABOUT_PARAGRAPHS, identityRows: DEFAULT_ABOUT_IDENTITY });

            // ---- Load data from Firestore via REST API ----
            useEffect(() => {
                async function loadAll() {
                    try {
                        const [sk, pr, ex, co, ab] = await Promise.all([
                            fsGet("skills"), fsGet("projects"), fsGet("experience"),
                            fsGet("contact"), fsGet("about")
                        ]);
                        if (sk?.groups) setSkills(sk.groups);
                        if (pr?.items) setProjects(pr.items);
                        if (ex?.items) setExperience(ex.items);
                        if (co?.links) setContactLinks(co.links);
                        if (ab) setAboutData(prev => ({
                            paragraphs: ab.paragraphs || prev.paragraphs,
                            identityRows: ab.identityRows || prev.identityRows
                        }));
                    } catch (e) { console.warn("Firestore load failed, using defaults.", e.message); }
                }
                loadAll();
            }, []);

            // ---- Save helpers ----
            const _save = (docId, data) => {
                fsSet(docId, data).catch(err => console.error("[Firestore save error]", docId, err.message));
            };
            const saveSkills = d => { setSkills(d); _save("skills", { groups: d }); };
            const saveProjects = d => { setProjects(d); _save("projects", { items: d }); };
            const saveExperience = d => { setExperience(d); _save("experience", { items: d }); };
            const saveContactLinks = d => { setContactLinks(d); _save("contact", { links: d }); };
            const saveAboutData = d => { setAboutData(d); _save("about", d); };

            // ---- Admin login / logout ----
            const adminLogin = (password) => {
                if (password !== ADMIN_PASS) return false;
                setIsAdmin(true);
                return true;
            };
            const adminLogout = () => setIsAdmin(false);

            // ---- Seed database (satu kali saat setup) ----
            const seedDatabase = async () => {
                try {
                    await Promise.all([
                        fsSet("skills", { groups: DEFAULT_SKILL_GROUPS }),
                        fsSet("projects", { items: DEFAULT_CREATIONS }),
                        fsSet("experience", { items: DEFAULT_EXPERIENCE }),
                        fsSet("contact", { links: DEFAULT_CONTACT_LINKS }),
                        fsSet("about", { paragraphs: DEFAULT_ABOUT_PARAGRAPHS, identityRows: DEFAULT_ABOUT_IDENTITY })
                    ]);
                    alert("Database seeded! Semua data default sudah disimpan ke Firestore.");
                } catch (err) {
                    alert("Seed GAGAL: " + err.message);
                    console.error("[Seed error]", err);
                }
            };

            // ---- Keyboard shortcut ----
            useEffect(() => {
                const h = e => {
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "A") {
                        e.preventDefault(); setShowPanel(v => !v);
                    }
                };
                window.addEventListener("keydown", h);
                return () => window.removeEventListener("keydown", h);
            }, []);

            return (
                <AdminCtx.Provider value={{
                    isAdmin, setIsAdmin, showPanel, setShowPanel,
                    skills, projects, experience, contactLinks, aboutData,
                    saveSkills, saveProjects, saveExperience, saveContactLinks, saveAboutData,
                    adminLogin, adminLogout, seedDatabase
                }}>
                    {children}
                    {showPanel && <AdminPanel />}
                </AdminCtx.Provider>
            );
        }
        function useAdmin() { return useContext(AdminCtx); }

        /* ============================================================
           DRAG-SORT HOOK — reorder admin lists via HTML5 DnD
           ============================================================ */
        function useDragSort(items, onSave) {
            const [dragIdx, setDragIdx] = useState(null);
            const [overIdx, setOverIdx] = useState(null);
            const dragProps = (idx) => ({
                draggable: true,
                onDragStart: (e) => { e.dataTransfer.effectAllowed = "move"; setDragIdx(idx); },
                onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (idx !== dragIdx) setOverIdx(idx); },
                onDrop: (e) => {
                    e.preventDefault();
                    if (dragIdx !== null && dragIdx !== idx) {
                        const arr = [...items];
                        const [spliced] = arr.splice(dragIdx, 1);
                        arr.splice(idx, 0, spliced);
                        onSave(arr);
                    }
                    setDragIdx(null); setOverIdx(null);
                },
                onDragEnd: () => { setDragIdx(null); setOverIdx(null); },
                style: {
                    opacity: dragIdx === idx ? 0.3 : 1,
                    outline: overIdx === idx && dragIdx !== idx ? "2px solid rgba(107,163,122,.65)" : "2px solid transparent",
                    outlineOffset: 2, borderRadius: 12, transition: "opacity .1s", cursor: "grab"
                }
            });
            return dragProps;
        }

        /* ============================================================
           ADMIN PANEL — shared constants di luar component agar
           tidak di-recreate setiap render (fix: input focus hilang)
           ============================================================ */
        const ADMIN_OVERLAY = { position: "fixed", inset: 0, zIndex: 9999, background: "rgba(4,3,2,.88)", backdropFilter: "blur(8px)", display: "flex", alignItems: "center", justifyContent: "center" };
        const ADMIN_MODAL = { width: "min(780px, 96vw)", maxHeight: "90vh", overflow: "hidden", background: "linear-gradient(155deg, rgba(40,28,18,.97) 0%, rgba(18,12,6,.99) 100%)", border: "1px solid rgba(168,114,69,.3)", borderRadius: 20, boxShadow: "0 40px 80px -20px rgba(0,0,0,.9), 0 0 60px -20px rgba(168,114,69,.25)", display: "flex", flexDirection: "column" };
        const ADMIN_INP = { width: "100%", padding: "10px 14px", borderRadius: 8, background: "rgba(10,6,3,.85)", border: "1px solid rgba(168,114,69,.22)", color: "#efe2d0", outline: "none", fontSize: 14, fontFamily: "'Inter',sans-serif", boxSizing: "border-box" };
        const adminBtn = (a) => ({
            padding: "8px 16px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "'JetBrains Mono',monospace", letterSpacing: ".05em",
            background: a === "green" ? "linear-gradient(135deg, #5D4037, #388E3C)" : a === "red" ? "rgba(200,60,60,.18)" : "rgba(168,114,69,.12)",
            color: a === "green" ? "#fff8ed" : a === "red" ? "#ff8888" : "#c89067",
            border: `1px solid ${a === "red" ? "rgba(200,60,60,.3)" : "rgba(168,114,69,.28)"}`
        });

        function FormField({ label, value, onChange, as, rows, children }) {
            return (
                <div style={{ marginBottom: 12 }}>
                    <label style={{ display: "block", fontSize: 10, color: "#a87245", fontFamily: "'JetBrains Mono',monospace", letterSpacing: ".15em", marginBottom: 5, textTransform: "uppercase" }}>{label}</label>
                    {children ? children : as === "textarea"
                        ? <textarea value={value} onChange={onChange} rows={rows || 3} style={{ ...ADMIN_INP, resize: "vertical" }} />
                        : <input value={value} onChange={onChange} style={ADMIN_INP} />}
                </div>
            );
        }
        function SectionTitle({ children }) {
            return <div style={{ fontSize: 17, fontWeight: 600, color: "#efe2d0", marginBottom: 18 }}>{children}</div>;
        }
        function ItemRow({ icon, title, sub, onEdit, onDelete }) {
            return (
                <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", background: "rgba(168,114,69,.05)", border: "1px solid rgba(168,114,69,.14)", borderRadius: 12 }}>
                    <span style={{ color: "#a87245", fontSize: 13, opacity: 0.45, userSelect: "none", flexShrink: 0, lineHeight: 1 }}>⠿</span>
                    {icon && <span style={{ fontSize: 22 }}>{icon}</span>}
                    <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: "#efe2d0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</div>
                        {sub && <div style={{ fontSize: 11, color: "#a87245", fontFamily: "'JetBrains Mono',monospace" }}>{sub}</div>}
                    </div>
                    <button onClick={onEdit} style={adminBtn("")}>✏</button>
                    <button onClick={onDelete} style={adminBtn("red")}>🗑</button>
                </div>
            );
        }

        function AdminPanel() {
            const {
                isAdmin, setShowPanel,
                skills, projects, experience, contactLinks, aboutData,
                saveSkills, saveProjects, saveExperience, saveContactLinks, saveAboutData,
                adminLogin, adminLogout, seedDatabase
            } = useAdmin();

            const [pass, setPass] = useState("");
            const [passErr, setPassErr] = useState(false);
            const [tab, setTab] = useState("projects");

            // Projects state
            const [editingProject, setEditingProject] = useState(null);
            const [pForm, setPForm] = useState({ glyph: "", title: "", subtitle: "", description: "", stats: "", tags: "", link: "" });

            // Skills state
            const [editingGroup, setEditingGroup] = useState(null);
            const [gForm, setGForm] = useState({ icon: "", label: "" });
            const [newSkill, setNewSkill] = useState({});

            // Experience state
            const BLANK_EXP = { role: "", org: "", loc: "", time: "", type: "", accent: "sepia", desc: "", bullets: [], specialBox: null, discography: null };
            const [editingExp, setEditingExp] = useState(null);
            const [eForm, setEForm] = useState(BLANK_EXP);
            const [newBullet, setNewBullet] = useState("");
            const [hasSpecialBox, setHasSpecialBox] = useState(false);
            const [hasDiscography, setHasDiscography] = useState(false);
            const [newDisc, setNewDisc] = useState({ year: "", title: "", desc: "" });

            // About state
            const [editingParaIdx, setEditingParaIdx] = useState(null);
            const [paraVal, setParaVal] = useState("");
            const [editingRowIdx, setEditingRowIdx] = useState(null);
            const [rowForm, setRowForm] = useState({ label: "", val: "" });
            const [newRow, setNewRow] = useState({ label: "", val: "" });

            // Contact state
            const [editingLinkIdx, setEditingLinkIdx] = useState(null);
            const [lForm, setLForm] = useState({ label: "", handle: "", href: "", glyph: "" });
            const [newLink, setNewLink] = useState({ label: "", handle: "", href: "", glyph: "" });

            // Drag-sort hooks (called at top level — no conditionals)
            const projDrag = useDragSort(projects, saveProjects);
            const skillDrag = useDragSort(skills, saveSkills);
            const expDrag = useDragSort(experience, saveExperience);
            const linkDrag = useDragSort(contactLinks, saveContactLinks);
            const rowDrag = useDragSort(aboutData.identityRows, rows => saveAboutData({ ...aboutData, identityRows: rows }));

            const close = () => { setShowPanel(false); setPass(""); setPassErr(false); };

            const tryLogin = () => {
                const ok = adminLogin(pass);
                if (!ok) setPassErr(true);
            };


            // ----- Projects tab -----
            const startEditProject = p => { setEditingProject(p.id); setPForm({ ...p, tags: p.tags.join(", ") }); };
            const startNewProject = () => { setEditingProject("new"); setPForm({ glyph: "⚡", title: "", subtitle: "", description: "", stats: "", tags: "", link: "" }); };
            const saveProject = () => {
                const item = { ...pForm, tags: pForm.tags.split(",").map(t => t.trim()).filter(Boolean) };
                if (editingProject === "new") { item.id = Date.now(); saveProjects([...projects, item]); }
                else saveProjects(projects.map(p => p.id === editingProject ? { ...p, ...item } : p));
                setEditingProject(null);
            };
            const deleteProject = id => { if (window.confirm("Delete project?")) saveProjects(projects.filter(p => p.id !== id)); };

            // ----- Skills tab -----
            const startEditGroup = g => { setEditingGroup(g.id); setGForm({ icon: g.icon, label: g.label }); };
            const startNewGroup = () => { setEditingGroup("new"); setGForm({ icon: "🏫", label: "" }); };
            const saveGroup = () => {
                if (editingGroup === "new") saveSkills([...skills, { id: Date.now(), ...gForm, items: [] }]);
                else saveSkills(skills.map(g => g.id === editingGroup ? { ...g, ...gForm } : g));
                setEditingGroup(null);
            };
            const deleteGroup = id => { if (window.confirm("Delete group?")) saveSkills(skills.filter(g => g.id !== id)); };
            const addSkill = gId => { const v = (newSkill[gId] || "").trim(); if (!v) return; saveSkills(skills.map(g => g.id === gId ? { ...g, items: [...g.items, v] } : g)); setNewSkill(p => ({ ...p, [gId]: "" })); };
            const removeSkill = (gId, idx) => saveSkills(skills.map(g => g.id === gId ? { ...g, items: g.items.filter((_, i) => i !== idx) } : g));

            // ----- Experience tab -----
            const startEditExp = exp => {
                setEditingExp(exp.id);
                setEForm({ ...exp });
                setHasSpecialBox(!!exp.specialBox);
                setHasDiscography(!!exp.discography);
                setNewBullet("");
            };
            const startNewExp = () => {
                setEditingExp("new");
                setEForm({ ...BLANK_EXP });
                setHasSpecialBox(false);
                setHasDiscography(false);
                setNewBullet("");
            };
            const saveExp = () => {
                const item = {
                    ...eForm,
                    specialBox: hasSpecialBox ? eForm.specialBox || { title: "", text: "" } : null,
                    discography: hasDiscography ? eForm.discography || [] : null
                };
                if (editingExp === "new") { item.id = Date.now(); saveExperience([...experience, item]); }
                else saveExperience(experience.map(e => e.id === editingExp ? { ...e, ...item } : e));
                setEditingExp(null);
            };
            const deleteExp = id => { if (window.confirm("Delete experience?")) saveExperience(experience.filter(e => e.id !== id)); };
            const addBullet = () => { const v = newBullet.trim(); if (!v) return; setEForm(f => ({ ...f, bullets: [...f.bullets, v] })); setNewBullet(""); };
            const removeBullet = idx => setEForm(f => ({ ...f, bullets: f.bullets.filter((_, i) => i !== idx) }));
            const addDiscEntry = () => {
                const v = { ...newDisc }; if (!v.title.trim()) return;
                setEForm(f => ({ ...f, discography: [...(f.discography || []), v] }));
                setNewDisc({ year: "", title: "", desc: "" });
            };
            const removeDiscEntry = idx => setEForm(f => ({ ...f, discography: f.discography.filter((_, i) => i !== idx) }));

            // ----- About tab -----
            const savePara = () => {
                const paras = [...aboutData.paragraphs];
                paras[editingParaIdx] = paraVal;
                saveAboutData({ ...aboutData, paragraphs: paras });
                setEditingParaIdx(null);
            };
            const saveRow = () => {
                const rows = [...aboutData.identityRows];
                rows[editingRowIdx] = { ...rows[editingRowIdx], ...rowForm };
                saveAboutData({ ...aboutData, identityRows: rows });
                setEditingRowIdx(null);
            };
            const addRow = () => {
                if (!newRow.label.trim()) return;
                saveAboutData({ ...aboutData, identityRows: [...aboutData.identityRows, { ...newRow, color: "var(--cream)" }] });
                setNewRow({ label: "", val: "" });
            };
            const deleteRow = idx => saveAboutData({ ...aboutData, identityRows: aboutData.identityRows.filter((_, i) => i !== idx) });

            // ----- Contact tab -----
            const startEditLink = (link, idx) => { setEditingLinkIdx(idx); setLForm({ ...link }); };
            const startNewLink = () => { setEditingLinkIdx("new"); setLForm({ label: "", handle: "", href: "", glyph: "" }); };
            const saveLink = () => {
                if (editingLinkIdx === "new") saveContactLinks([...contactLinks, lForm]);
                else { const arr = [...contactLinks]; arr[editingLinkIdx] = lForm; saveContactLinks(arr); }
                setEditingLinkIdx(null);
            };
            const deleteLink = idx => saveContactLinks(contactLinks.filter((_, i) => i !== idx));

            return (
                <div style={ADMIN_OVERLAY} data-no-wheel onClick={e => e.target === e.currentTarget && close()}>
                    <div style={ADMIN_MODAL} className="admin-scroll">

                        {/* Header */}
                        <div style={{ padding: "18px 24px", borderBottom: "1px solid rgba(168,114,69,.18)", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
                            <div>
                                <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: 24, color: "#efe2d0" }}>Admin Panel</div>
                                <div style={{ fontSize: 10, color: "#a87245", fontFamily: "'JetBrains Mono',monospace", letterSpacing: ".15em", marginTop: 2 }}>
                                    {window.__db ? "🟢 Firestore connected" : "🔴 Offline — no Firebase config"} · CTRL+SHIFT+A
                                </div>
                            </div>
                            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                                {isAdmin && <button onClick={adminLogout} style={{ ...adminBtn("red"), fontSize: 11 }}>Logout</button>}
                                <button onClick={close} style={{ ...adminBtn(""), padding: "6px 12px", fontSize: 16 }}>×</button>
                            </div>
                        </div>

                        {!isAdmin ? (
                            <div style={{ padding: 40, display: "flex", flexDirection: "column", alignItems: "center", gap: 18 }}>
                                <div style={{ fontSize: 44 }}>🔒</div>
                                <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: 26, color: "#efe2d0" }}>Enter Password</div>
                                <input type="password" value={pass} onChange={e => { setPass(e.target.value); setPassErr(false); }}
                                    onKeyDown={e => e.key === "Enter" && tryLogin()} placeholder="Admin password…"
                                    style={{ ...ADMIN_INP, maxWidth: 300, textAlign: "center" }} autoFocus />
                                {passErr && <div style={{ color: "#ff8888", fontSize: 13 }}>Incorrect password.</div>}
                                <button onClick={tryLogin} style={{ ...adminBtn("green"), padding: "10px 36px", fontSize: 13 }}>Unlock →</button>
                            </div>
                        ) : (
                            <>
                                {/* Tab bar */}
                                <div style={{ padding: "12px 24px", borderBottom: "1px solid rgba(168,114,69,.12)", display: "flex", gap: 8, flexWrap: "wrap", flexShrink: 0 }}>
                                    {["projects", "skills", "experience", "about", "contact"].map(t => (
                                        <button key={t} onClick={() => { setTab(t); setEditingProject(null); setEditingGroup(null); setEditingExp(null); setEditingParaIdx(null); setEditingRowIdx(null); setEditingLinkIdx(null); }}
                                            style={{ ...adminBtn(tab === t ? "green" : ""), textTransform: "capitalize" }}>{t}</button>
                                    ))}
                                    <button onClick={seedDatabase} style={{ ...adminBtn(""), marginLeft: "auto", fontSize: 11 }} title="Push all default data to Firestore (satu kali setup)">⬆ Seed DB</button>
                                </div>

                                <div className="admin-scroll" style={{ flex: 1, overflowY: "auto", padding: 24 }}>

                                    {/* ===== PROJECTS TAB ===== */}
                                    {tab === "projects" && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                                            {editingProject !== null ? (
                                                <div>
                                                    <SectionTitle>{editingProject === "new" ? "New Project" : "Edit Project"}</SectionTitle>
                                                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
                                                        <FormField label="Glyph (emoji)" value={pForm.glyph} onChange={e => setPForm(p => ({ ...p, glyph: e.target.value }))} />
                                                        <FormField label="Stats label" value={pForm.stats} onChange={e => setPForm(p => ({ ...p, stats: e.target.value }))} />
                                                    </div>
                                                    <FormField label="Title" value={pForm.title} onChange={e => setPForm(p => ({ ...p, title: e.target.value }))} />
                                                    <FormField label="Subtitle" value={pForm.subtitle} onChange={e => setPForm(p => ({ ...p, subtitle: e.target.value }))} />
                                                    <FormField label="Description" value={pForm.description} onChange={e => setPForm(p => ({ ...p, description: e.target.value }))} as="textarea" />
                                                    <FormField label="Tags (comma separated)" value={pForm.tags} onChange={e => setPForm(p => ({ ...p, tags: e.target.value }))} />
                                                    <FormField label="Link (optional)" value={pForm.link} onChange={e => setPForm(p => ({ ...p, link: e.target.value }))} />
                                                    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                                                        <button onClick={saveProject} style={adminBtn("green")}>Save</button>
                                                        <button onClick={() => setEditingProject(null)} style={adminBtn("")}>Cancel</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <>
                                                    <button onClick={startNewProject} style={{ ...adminBtn("green"), alignSelf: "flex-start" }}>+ Add Project</button>
                                                    {projects.map((p, idx) => (
                                                        <div key={p.id} {...projDrag(idx)}>
                                                            <ItemRow icon={p.glyph} title={p.title} sub={p.subtitle} onEdit={() => startEditProject(p)} onDelete={() => deleteProject(p.id)} />
                                                        </div>
                                                    ))}
                                                </>
                                            )}
                                        </div>
                                    )}

                                    {/* ===== SKILLS TAB ===== */}
                                    {tab === "skills" && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                                            {editingGroup !== null ? (
                                                <div>
                                                    <SectionTitle>{editingGroup === "new" ? "New Group" : "Edit Group"}</SectionTitle>
                                                    <div style={{ display: "grid", gridTemplateColumns: "80px 1fr", gap: "0 16px" }}>
                                                        <FormField label="Icon" value={gForm.icon} onChange={e => setGForm(g => ({ ...g, icon: e.target.value }))} />
                                                        <FormField label="Group Name" value={gForm.label} onChange={e => setGForm(g => ({ ...g, label: e.target.value }))} />
                                                    </div>
                                                    <div style={{ display: "flex", gap: 8 }}>
                                                        <button onClick={saveGroup} style={adminBtn("green")}>Save</button>
                                                        <button onClick={() => setEditingGroup(null)} style={adminBtn("")}>Cancel</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <>
                                                    <button onClick={startNewGroup} style={{ ...adminBtn("green"), alignSelf: "flex-start" }}>+ Add Group</button>
                                                    {skills.map((g, gIdx) => {
                                                        const dp = skillDrag(gIdx);
                                                        return (
                                                            <div key={g.id} {...dp} style={{ ...dp.style, background: "rgba(168,114,69,.04)", border: "1px solid rgba(168,114,69,.14)", borderRadius: 14, padding: 16 }}>
                                                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                                                                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                                                        <span style={{ color: "#a87245", fontSize: 12, opacity: 0.45, userSelect: "none", marginRight: 2 }}>⠿</span>
                                                                        <span style={{ fontSize: 20 }}>{g.icon}</span>
                                                                        <span style={{ fontSize: 15, fontWeight: 600, color: "#efe2d0" }}>{g.label}</span>
                                                                        <span style={{ fontSize: 11, color: "#a87245", fontFamily: "'JetBrains Mono',monospace" }}>({g.items.length})</span>
                                                                    </div>
                                                                    <div style={{ display: "flex", gap: 6 }}>
                                                                        <button onClick={() => startEditGroup(g)} style={adminBtn("")}>✏</button>
                                                                        <button onClick={() => deleteGroup(g.id)} style={adminBtn("red")}>🗑</button>
                                                                    </div>
                                                                </div>

        /* ============================================================
           GLOBAL DOT GRID — denser, finer dots, fade near cursor
           ============================================================ */
        function GlobalDotGrid() {
            const canvasRef = useRef(null);
            const sRef = useRef({ mouse: { x: -9999, y: -9999, active: false }, dots: [], raf: 0 });

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const spacing = 22;
                const s = sRef.current;

                function resize() {
                    const vw = window.innerWidth;
                    const vh = window.innerHeight;
                    canvas.width = vw * dpr;
                    canvas.height = vh * dpr;
                    canvas.style.width = vw + "px";
                    canvas.style.height = vh + "px";
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    buildDots();
                }

                function buildDots() {
                    const vw = window.innerWidth;
                    const vh = window.innerHeight;
                    const cols = Math.ceil(vw / spacing) + 1;
                    const rows = Math.ceil(vh / spacing) + 2;
                    const offX = ((vw % spacing) / 2) + spacing / 2;
                    const arr = [];
                    for (let i = 0; i < rows; i++) {
                        for (let j = 0; j < cols; j++) {
                            const bx = offX + j * spacing;
                            const by = i * spacing + spacing / 2;
                            arr.push({
                                bx, by,         // base coordinate
                                x: bx, y: by,   // current position
                                vx: 0, vy: 0,   // velocities
                                a: 1            // opacity
                            });
                        }
                    }
                    s.dots = arr;
                }

                function tick() {
                    const vw = parseInt(canvas.style.width) || window.innerWidth;
                    const vh = parseInt(canvas.style.height) || window.innerHeight;
                    const m = s.mouse;
                    const infl = 100; // repellent radius
                    ctx.clearRect(0, 0, vw, vh);
                    const dots = s.dots;

                    for (let k = 0; k < dots.length; k++) {
                        const d = dots[k];

                        // Spring acceleration pulling back to base coordinate
                        const ax = (d.bx - d.x) * 0.14;
                        const ay = (d.by - d.y) * 0.14;
                        d.vx += ax;
                        d.vy += ay;

                        if (m.active) {
                            const dx = d.x - m.x;
                            const dy = d.y - m.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < infl) {
                                const force = (1 - dist / infl); // 0 to 1
                                const forceFactor = force * force * 0.52; // non-linear push for smooth dynamics
                                d.vx += (dx / (dist || 1)) * forceFactor * 16;
                                d.vy += (dy / (dist || 1)) * forceFactor * 16;
                                d.a += (Math.max(0.2, dist / infl) - d.a) * 0.22;
                            } else {
                                d.a += (1 - d.a) * 0.08;
                            }
                        } else {
                            d.a += (1 - d.a) * 0.06;
                        }

                        // Apply damping and integrate velocities
                        d.vx *= 0.74;
                        d.vy *= 0.74;
                        d.x += d.vx;
                        d.y += d.vy;

                        if (d.a < 0.015) continue;
                        ctx.globalAlpha = d.a * 0.32;
                        ctx.fillStyle = "rgb(168,114,69)";
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    s.raf = requestAnimationFrame(tick);
                }

                resize();
                s.raf = requestAnimationFrame(tick);

                const onMove = e => { s.mouse.x = e.clientX; s.mouse.y = e.clientY; s.mouse.active = true; };
                const onLeave = () => { s.mouse.active = false; };

                window.addEventListener("resize", resize);
                window.addEventListener("mousemove", onMove);
                document.addEventListener("mouseleave", onLeave);

                return () => {
                    cancelAnimationFrame(s.raf);
                    window.removeEventListener("resize", resize);
                    window.removeEventListener("mousemove", onMove);
                    document.removeEventListener("mouseleave", onLeave);
                };
            }, []);

            return <canvas ref={canvasRef} style={{ position: "fixed", top: 0, left: 0, pointerEvents: "none", zIndex: 1 }} />;
        }

           ============================================================ */
        function Card({ children, style, glow = "sepia", padding = 28, className = "", area }) {
            const borderGlow =
                glow === "moss"
                    ? "0 0 0 1px rgba(107,163,122,.18) inset, 0 30px 60px -20px rgba(56,142,60,.18), 0 0 0 1px rgba(56,142,60,.08), 0 0 60px -10px rgba(107,163,122,.22)"

                        ? "0 0 0 1px rgba(168,114,69,.22) inset, 0 30px 60px -20px rgba(20,16,11,.6), 0 0 60px -10px rgba(168,114,69,.25), 0 0 90px -20px rgba(107,163,122,.18)"

            const responsivePadding = typeof padding === "number"
                ? `clamp(18px, 4vw, ${padding}px)`
                : padding;

            return (
                <div className={"bento-card " + className} data-area={area} style={{
                    position: "relative", gridArea: area, borderRadius: 22,
                    background: "linear-gradient(155deg, rgba(36,24,14,.52) 0%, rgba(24,17,10,.68) 60%, rgba(16,12,8,.75) 100%)",
                    backdropFilter: "blur(16px) saturate(120%)", WebkitBackdropFilter: "blur(16px) saturate(120%)",

                        {children}

                </div>

        function PhotoCard({ onMouseEnter, onMouseLeave, expanded }) {
            const [tilt, setTilt] = useState({ rx: 0, ry: 0, x: 50, y: 50 });
            const [isHovered, setIsHovered] = useState(false);

            const handleMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const xVal = e.clientX - rect.left;
                const yVal = e.clientY - rect.top;
                const xPct = (xVal / rect.width) * 100;
                const yPct = (yVal / rect.height) * 100;

                // Max rotation of 12 degrees
                const ry = ((xVal - rect.width / 2) / (rect.width / 2)) * 12;
                const rx = -((yVal - rect.height / 2) / (rect.height / 2)) * 12;

                setTilt({ rx, ry, x: xPct, y: yPct });
            };

            const handleMouseEnter = (e) => {
                setIsHovered(true);
                onMouseEnter(e);
            };

            const handleMouseLeave = (e) => {
                setIsHovered(false);
                setTilt({ rx: 0, ry: 0, x: 50, y: 50 });
                onMouseLeave(e);
            };

            const transformStyle = isHovered
                ? `perspective(1000px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg) scale(1.04)`
                : `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;

            const spotlightStyle = isHovered
                ? `radial-gradient(circle at ${tilt.x}% ${tilt.y}%, rgba(255,220,180,.12) 0%, transparent 60%), radial-gradient(70% 50% at 50% 30%, rgba(56,142,60,.15), transparent 70%)`
                : `radial-gradient(70% 50% at 50% 30%, rgba(56,142,60,.15), transparent 70%)`;

            return (
                <Card area="photo" glow="sepia" padding={0}
                    style={{
                        transform: transformStyle,
                        zIndex: expanded ? 10 : "auto",
                        transition: isHovered ? "transform 0.1s ease-out, opacity 0.35s ease" : "transform 0.5s var(--ease-soft), opacity 0.35s ease"
                    }}>
                    <div onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave} onMouseMove={handleMouseMove}

                        <img src="assets/portrait-garden.jpg" alt="Nazif Effendy" style={{

                        }} />

                        }} />
                        <div style={{
                            position: "absolute", inset: 0,
                            background: spotlightStyle, mixBlendMode: "soft-light",
                            transition: "background 0.15s ease-out"
                        }} />
                        <div style={{ position: "absolute", top: 18, left: 18 }}><MetaLabel glow="moss">N · H · E</MetaLabel></div>
                        <div style={{ position: "absolute", top: 18, right: 18, fontFamily: "'JetBrains Mono',monospace", fontSize: 10, letterSpacing: ".22em", color: "#c89067" }}>ID—01</div>
                        <div style={{ position: "absolute", bottom: 22, left: 22, right: 22 }}>

                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>Music production collaboration or creative partnership</span></div>
                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>Software engineering roles with a creative angle</span></div>
                                <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#6ba37a", fontFamily: "'JetBrains Mono',monospace" }}>→</span><span>Any project at the intersection of tech and creative production</span></div>
                            </div>

                    </div>

                    {/* FAQ / Reasons to Connect */}
                    <div style={{ marginTop: 12 }}>
                        <MetaLabel glow="sepia">What to reach out about</MetaLabel>
                        <h3 style={{ fontFamily: "'Instrument Serif',serif", fontSize: 32, fontWeight: 400, color: "var(--cream)", margin: "14px 0" }}>
                            Good <em style={{ fontStyle: "italic", color: "#c89067" }}>reasons</em> to connect.
                        </h3>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16 }} className="zoom-group">
                            <Card glow="sepia" padding={20}>
                                <div style={{ fontSize: 24, marginBottom: 12 }}>🤖</div>
                                <h4 style={{ fontFamily: "'Instrument Serif',serif", fontSize: 19, color: "var(--cream)", margin: "0 0 8px" }}>CS &amp; AI Projects</h4>
                                <p style={{ margin: 0, fontSize: 13, color: "var(--cream-dim)", lineHeight: 1.55 }}>
                                    NLP research, ML model development, sentiment analysis, full-stack web applications, or academic collaboration in computer science. Comfortable with Python, React, Flask, and the full AI/ML toolkit.
                                </p>
                            </Card>
                            <Card glow="moss" padding={20}>
                                <div style={{ fontSize: 24, marginBottom: 12 }}>🎵</div>
                                <h4 style={{ fontFamily: "'Instrument Serif',serif", fontSize: 19, color: "var(--cream)", margin: "0 0 8px" }}>Music &amp; Creative</h4>
                                <p style={{ margin: 0, fontSize: 13, color: "var(--cream-dim)", lineHeight: 1.55 }}>
                                    Music production collaboration, mixing/mastering feedback, event performance bookings, or creative partnerships that combine audio and visual production. Reach out via Instagram @fizanhamza for music-specific inquiries.

                            <Card glow="sepia" padding={20}>
                                <div style={{ fontSize: 24, marginBottom: 12 }}>⚡</div>

        /* ============================================================
           WELCOME OVERLAY
           ============================================================ */
        function WelcomeOverlay() {
            const { hasEntered, enter } = useAudio();
            const [exiting, setExiting] = useState(false);
            const [hidden, setHidden] = useState(() => hasEntered);

            const handleEnter = () => {
                enter();
                setExiting(true);
                setTimeout(() => setHidden(true), 950);
            };

            useEffect(() => {
                const onKey = (e) => {
                    if (!hidden && (e.key === "Enter" || e.key === " ")) {
                        e.preventDefault();
                        handleEnter();
                    }
                };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, [hidden]);

            if (hidden) return null;
            return (
                <div className={"welcome-overlay" + (exiting ? " exit" : "")} data-no-wheel>
                    <div className="welcome-content">
                        <div className="welcome-meta">Portfolio · 2026</div>
                        <h1 className="welcome-title">
                            Nazif <em>Hamza</em><br />Effendy
                        </h1>
                        <div className="welcome-sub">CS Student · Music Producer · Jakarta</div>
                        <div className="welcome-divider" />
                        <button className="welcome-enter" onClick={handleEnter} autoFocus>
                            Enter the experience <span>→</span>
                        </button>
                        <div className="welcome-audio-hint">
                            <i /> with original score by Fizan
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================================================
           AUDIO TOGGLE
           ============================================================ */
        function AudioToggle() {
            const { playing, toggle, hasEntered } = useAudio();
            if (!hasEntered) return null;
            return (
                <button
                    className={"audio-toggle" + (!playing ? " muted" : "")}
                    onClick={toggle}
                    aria-label={playing ? "Mute music" : "Play music"}
                    title={playing ? "Mute music" : "Play music"}
                >
                    <span className="audio-bars" aria-hidden="true">
                        <i /><i /><i />
                    </span>
                </button>
            );
        }

        /* ============================================================
           NAV BAR (top)
           ============================================================ */
        function NavBar() {
            const { panel, goTo } = usePanel();
            const navItems = useMemo(() => PANELS.filter(p => p.inNav), []);
            const currentId = PANELS[panel]?.id;

            return (
                <header className="nav-bar">
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div className="nav-brand-mark">n</div>
                        <div className="nav-brand-text">
                            <div style={{ fontFamily: "'Instrument Serif',serif", fontSize: 17, color: "var(--cream)", lineHeight: 1 }}>nazif.effendy</div>
                            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "#a87245", letterSpacing: ".22em" }}>CS · MUSIC · AI · JAKARTA</div>
                        </div>
                    </div>

                    <nav className="nav-pills">
                        {navItems.map(p => (
                            <button
                                key={p.id}
                                className={"nav-pill" + (currentId === p.id ? " active" : "")}
                                onClick={() => goTo(p.id)}
                            >
                                {p.label}
                            </button>
                        ))}
                    </nav>

                    <div className="nav-right">
                        <span className="nav-status">● ONLINE</span>
                        <AudioToggle />
                        <button className="nav-resume" onClick={() => goTo("contact")}>Contact Me</button>
                    </div>
                </header>
            );
        }

        /* ============================================================
           HORIZONTAL TRACK — keyboard only (no wheel/touch horizontal shifting)
           ============================================================ */
        function HorizontalTrack({ children }) {
            const { panel, setPanel, total } = usePanel();
            const trackRef = useRef(null);

            useEffect(() => {
                const onKey = (e) => {
                    const tag = e.target?.tagName;
                    if (tag === "INPUT" || tag === "TEXTAREA") return;
                    if (e.key === "ArrowRight" || e.key === "PageDown") {
                        e.preventDefault(); setPanel(p => p + 1);
                    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
                        e.preventDefault(); setPanel(p => p - 1);
                    } else if (e.key === "Home") {
                        e.preventDefault(); setPanel(0);
                    } else if (e.key === "End") {
                        e.preventDefault(); setPanel(total - 1);
                    }
                };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, [setPanel, total]);

            return (
                <div className="track-viewport" ref={trackRef}>
                    <div className="track" style={{
                        width: `${total * 100}vw`,
                        transform: `translate3d(-${panel * 100}vw, 0, 0)`
                    }}>
                        {children}
                    </div>
                </div>
            );
        }

        function Panel({ id, children }) {
            const { panel } = usePanel();
            const idx = PANELS.findIndex(p => p.id === id);
            const isActive = idx === panel;
            return (
                <section className={"panel" + (isActive ? " is-active" : "")} id={id} data-panel={id}>
                    <div className="panel-content" key={isActive ? id + "-on" : id + "-off"}>
                        {children}
                    </div>
                </section>
            );
        }

        /* ============================================================
           HORIZONTAL NAV (bottom)
           ============================================================ */
        function HorizontalNav() {
            const { panel, setPanel, total } = usePanel();
            const { setShowPanel } = useAdmin();
            const current = PANELS[panel];
            return (
                <footer className="hnav">
                    <div className="hnav-indicator">
                        <strong>{String(panel + 1).padStart(2, "0")} / {String(total).padStart(2, "0")}</strong>
                        <span className="hnav-indicator-name">{current?.label}</span>
                    </div>
                    <div className="hnav-center">
                        <button className="hnav-arrow" onClick={() => setPanel(panel - 1)} disabled={panel === 0} aria-label="Previous panel">←</button>
                        <div className="hnav-dots">
                            {PANELS.map((p, i) => (
                                <button
                                    key={p.id}
                                    className={"hnav-dot" + (i === panel ? " active" : "")}
                                    onClick={() => setPanel(i)}
                                    aria-label={"Go to " + p.label}
                                >
                                    <span className="hnav-dot-label">{p.label}</span>
                                </button>
                            ))}
                        </div>
                        <button className="hnav-arrow" onClick={() => setPanel(panel + 1)} disabled={panel === total - 1} aria-label="Next panel">→</button>
                    </div>
                    <div className="hnav-meta" style={{ display: "flex", alignItems: "center", gap: 12, justifyContent: "flex-end" }}>
                        <button onClick={() => setShowPanel(true)} style={{ background: "none", border: "none", color: "var(--sepia-deep)", cursor: "pointer", fontSize: 13, padding: 0, display: "inline-flex", alignItems: "center", transition: "color 0.3s" }} title="Admin Control Panel">🔒</button>
                        <span><b>© 2026</b> NAZIF</span>
                    </div>
                </footer>
            );
        }

        /* ============================================================
           STAGE
           ============================================================ */
        function Stage() {
            const { hasEntered } = useAudio();
            return (
                <div className={"stage" + (hasEntered ? " entered" : "")}>
                    <NavBar />
                    <HorizontalTrack>
                        <Panel id="home"><HomePanel /></Panel>
                        <Panel id="about"><AboutSection /></Panel>
                        <Panel id="experience"><ExperienceSection /></Panel>
                        <Panel id="skills"><SkillsSection /></Panel>
                        <Panel id="projects"><ProjectsSection /></Panel>
                        <Panel id="numbers"><NumbersSection /></Panel>
                        <Panel id="contact"><ContactSection /></Panel>
                    </HorizontalTrack>
                    <HorizontalNav />
                </div>
            );
        }

        /* ============================================================
           APP
           ============================================================ */
        function App() {
            return (
                <AudioProvider>
                    <AdminProvider>
                        <PanelProvider>
                            <GlobalDotGrid />
                            <WelcomeOverlay />
                            <Stage />
                        </PanelProvider>
                    </AdminProvider>
                </AudioProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
